  @media (prefers-reduced-motion: reduce) {
    button { letter-spacing: 0.06em; }
  }
</style>
</head>
<body>

<div class="hud">
  <h1>鹈鹕骑自行车</h1>
  <button id="toggle" type="button" aria-pressed="false">暂停</button>

<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  var GROUND = 532;
  var R = 76;
  var AXLE_Y = GROUND - R;
  var REAR_X = 330;
  var FRONT_X = 770;
  var BB = { x: 530, y: AXLE_Y + 24 };
  var CRANK = 32;
  var HIP = { x: 448, y: 356 };
  var THIGH = 100;
  var SHIN = 96;
  var SPEED = 240;
  var GEAR = 1.25;

  if (AXLE_Y + R !== GROUND) throw new Error("wheels must meet the ground");

  function el(name, attrs) {
    var node = document.createElementNS(NS, name);
    for (var k in attrs) node.setAttribute(k, attrs[k]);
    return node;
  }

  function buildRotor(id, withCog) {
    var g = document.getElementById(id);
    var i;
    for (i = 0; i < 12; i++) {
      g.appendChild(el("line", {
        x1: 16, y1: 0, x2: 58, y2: 0,
        stroke: "#8b979e", "stroke-width": 2, "stroke-linecap": "round",
        transform: "rotate(" + (i * 30) + ")"
      }));
    }
    for (i = 0; i < 8; i++) {
      g.appendChild(el("rect", {
        x: 70, y: -3, width: 7, height: 6, rx: 1, fill: "#12181c",
        transform: "rotate(" + (i * 45) + ")"
      }));
    }
    if (withCog) {
      for (i = 0; i < 10; i++) {
        g.appendChild(el("rect", {
          x: -2.2, y: -20, width: 4.4, height: 7, rx: 0.6, fill: "#1c2428",
          transform: "rotate(" + (i * 36) + ")"
        }));
      }
    }
    g.appendChild(el("circle", { cx: 56, cy: 0, r: 4.5, fill: "#d4553a" }));
    g.appendChild(el("circle", { cx: 57.2, cy: -1.2, r: 1.4, fill: "#fff" }));
  }

  function buildCrank() {
    var g = document.getElementById("crank");
    var ring = el("g", { id: "chainring" });
    var i;
    for (i = 0; i < 16; i++) {
      ring.appendChild(el("rect", {
        x: -3, y: -30, width: 6, height: 8, rx: 1, fill: "#1c2428",
        transform: "rotate(" + (i * 22.5) + ")"
      }));
    }
    ring.appendChild(el("circle", { r: 22, fill: "#245060" }));
    ring.appendChild(el("circle", { r: 8, fill: "#d5dee3" }));
    for (i = 0; i < 5; i++) {
      var a = (i / 5) * Math.PI * 2;
      ring.appendChild(el("circle", {
        cx: Math.cos(a) * 14, cy: Math.sin(a) * 14, r: 2.2, fill: "#102830"
      }));
    }
    g.appendChild(ring);
    g.appendChild(el("line", {
      x1: -CRANK, y1: 0, x2: CRANK, y2: 0,
      stroke: "#2c3438", "stroke-width": 7, "stroke-linecap": "round"
    }));
    g.appendChild(el("circle", { r: 5, fill: "#1a1e22" }));
  }

  buildRotor("rear-rotor", true);
  buildRotor("front-rotor", false);
  buildCrank();

  var rearRotor = document.getElementById("rear-rotor");
  var frontRotor = document.getElementById("front-rotor");
  var crank = document.getElementById("crank");
  var pelican = document.getElementById("pelican");
  var nearWing = document.getElementById("near-wing-rot");
  var farWing = document.getElementById("far-wing-rot");
  var lid = document.getElementById("lid");
  var fish = document.getElementById("fish");
  var boat = document.getElementById("boat");
  var dunes = document.getElementById("dunes");
  var tufts = document.getElementById("tufts");
  var waves = document.getElementById("waves");
  var lane = document.getElementById("lane");
  var chain = document.getElementById("chain");
  var clouds = document.querySelectorAll(".cloud");
  var tuftNodes = document.querySelectorAll(".tuft");
  var nearThigh = document.getElementById("near-thigh");
  var nearShin = document.getElementById("near-shin");
  var nearKnee = document.getElementById("near-knee");
  var farThigh = document.getElementById("far-thigh");
  var farShin = document.getElementById("far-shin");
  var farKnee = document.getElementById("far-knee");
  var nearFoot = document.getElementById("near-foot");
  var farFoot = document.getElementById("far-foot");
  var toggle = document.getElementById("toggle");

  var TUFTS = [40, 280, 560, 900];
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var running = !reduce;
  var time = 0.35;
  var distance = 80;
  var lastTs = 0;
  var prevNear = null;
  var prevFar = null;

  function knee(hip, foot, prev) {
    var dx = foot.x - hip.x;
    var dy = foot.y - hip.y;
    var dist = Math.hypot(dx, dy) || 0.001;
    var max = THIGH + SHIN - 0.8;
    var min = Math.abs(THIGH - SHIN) + 0.8;
    var d = Math.min(max, Math.max(min, dist));
    var ux = dx / dist;
    var uy = dy / dist;
    var a = (THIGH * THIGH - SHIN * SHIN + d * d) / (2 * d);
    var h2 = THIGH * THIGH - a * a;
    if (h2 < 0) h2 = 0;
    var h = Math.sqrt(h2);
    var px = hip.x + ux * a;
    var py = hip.y + uy * a;
    var A = { x: px - uy * h, y: py + ux * h };
    var B = { x: px + uy * h, y: py - ux * h };
    if (prev) {
      var dA = (A.x - prev.x) * (A.x - prev.x) + (A.y - prev.y) * (A.y - prev.y);
      var dB = (B.x - prev.x) * (B.x - prev.x) + (B.y - prev.y) * (B.y - prev.y);
      return dA <= dB ? A : B;
    }
    return A.y <= B.y ? A : B;
  }

  function setLine(node, x1, y1, x2, y2) {
    node.setAttribute("x1", x1);
    node.setAttribute("y1", y1);
    node.setAttribute("x2", x2);
    node.setAttribute("y2", y2);
  }

  function drawLeg(thigh, shin, kneeDot, hip, foot, prev) {
    var k = knee(hip, foot, prev);
    var sx = k.x + (foot.x - k.x) * 0.9;
    var sy = k.y + (foot.y - k.y) * 0.9;
    setLine(thigh, hip.x, hip.y, k.x, k.y);
    setLine(shin, k.x, k.y, sx, sy);
    kneeDot.setAttribute("cx", k.x);
    kneeDot.setAttribute("cy", k.y);
    return k;
  }

  function hipPoint(local, bob, rock) {
    var a = rock * Math.PI / 180;
    var c = Math.cos(a);
    var s = Math.sin(a);
    return {
      x: HIP.x + local.x * c - local.y * s,
      y: HIP.y + bob + local.x * s + local.y * c
    };
  }

  function wrap(base, span, parallax) {
    var w = span + 200;
    var x = base - distance * parallax;
    x = ((x % w) + w) % w;
    return x - 100;
  }

  function render() {
    var wheelDeg = (distance / R) * (180 / Math.PI);
    var crankRad = distance / (R * GEAR);
    var crankDeg = crankRad * (180 / Math.PI);
    rearRotor.setAttribute("transform", "rotate(" + wheelDeg + ")");
    frontRotor.setAttribute("transform", "rotate(" + wheelDeg + ")");
    crank.setAttribute("transform", "translate(" + BB.x + " " + BB.y + ") rotate(" + crankDeg + ")");

    var nearPedal = {
      x: BB.x + Math.cos(crankRad) * CRANK,
      y: BB.y + Math.sin(crankRad) * CRANK
    };
    var farPedal = {
      x: BB.x + Math.cos(crankRad + Math.PI) * CRANK,
      y: BB.y + Math.sin(crankRad + Math.PI) * CRANK
    };

    var phase = Math.sin(crankRad * 2);
    var bob = phase * -7;
    var rock = phase * 2.4;
    pelican.setAttribute("transform", "translate(" + HIP.x + " " + (HIP.y + bob) + ") rotate(" + rock + ")");

    var nearHip = hipPoint({ x: 0, y: 0 }, bob, rock);
    var farHip = hipPoint({ x: -14, y: -8 }, bob, rock);
    prevNear = drawLeg(nearThigh, nearShin, nearKnee, nearHip, nearPedal, prevNear);
    prevFar = drawLeg(farThigh, farShin, farKnee, farHip, farPedal, prevFar);
    nearFoot.setAttribute("transform", "translate(" + nearPedal.x + " " + nearPedal.y + ")");
    farFoot.setAttribute("transform", "translate(" + farPedal.x + " " + farPedal.y + ")");

    var flap = Math.sin(time * 2.5) * 12;
    nearWing.setAttribute("transform", "rotate(" + flap + ")");
    farWing.setAttribute("transform", "rotate(" + (flap * 0.65) + ")");

    var blink = time % 4.6;
    var lidScale = 0;
    if (blink > 4.28 && blink < 4.55) {
      var u = (blink - 4.28) / 0.27;
      lidScale = u < 0.5 ? u * 2 : (1 - u) * 2;
    }
    lid.setAttribute("transform", "scale(1 " + lidScale.toFixed(3) + ")");

    fish.setAttribute("transform", "translate(790 334) rotate(" + (Math.sin(time * 3.1) * 8) + ")");

    var i;
    for (i = 0; i < clouds.length; i++) {
      var c = clouds[i];
      var x = wrap(parseFloat(c.getAttribute("data-x")), 1200, parseFloat(c.getAttribute("data-p")));
      c.setAttribute("transform", "translate(" + x + " " + c.getAttribute("data-y") + ")");
    }
    boat.setAttribute("transform", "translate(" + wrap(880, 1400, 0.22) + " 404)");
    dunes.setAttribute("transform", "translate(" + (-((distance * 0.35) % 560)) + " 0)");
    waves.setAttribute("transform", "translate(" + (-((distance * 0.18) % 240)) + " 0)");
    lane.setAttribute("patternTransform", "translate(" + (-(distance % 110)) + " 0)");
    chain.setAttribute("stroke-dashoffset", String(-distance * 0.45));

    for (i = 0; i < tuftNodes.length; i++) {
      var tx = TUFTS[i] - (distance % 1100);
      if (tx < -40) tx += 1100;
      tuftNodes[i].setAttribute("transform", "translate(" + tx + " 530)");
    }
  }

  function frame(ts) {
    if (!lastTs) lastTs = ts;
    var dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    if (running) {
      time += dt;
      distance += SPEED * dt;
    }
    render();
    if (running) requestAnimationFrame(frame);
  }

  function setButton() {
    toggle.textContent = running ? "暂停" : "继续";
    toggle.setAttribute("aria-pressed", running ? "false" : "true");
  }

  toggle.addEventListener("click", function () {
    running = !running;
    setButton();
    if (running) {
      lastTs = 0;
      requestAnimationFrame(frame);
    }
  });

  if (reduce) setButton();
  render();
  if (running) requestAnimationFrame(frame);
})();
</script>
</body>
</html>
